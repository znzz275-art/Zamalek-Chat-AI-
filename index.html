<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --primary: #e41e26;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: #f5f5f5; margin: 0; display: flex; height: 100vh; overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 260px; background: rgba(0,0,0,0.9); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 20px;
        }
        .nav-btn {
            padding: 15px; margin-bottom: 10px; background: var(--glass);
            border-radius: 12px; color: #fff; text-decoration: none;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
            border: 1px solid var(--border);
        }
        .nav-btn:hover { background: var(--primary); transform: translateX(-5px); }

        /* Main */
        .main-chat { flex: 1; display: flex; flex-direction: column; }
        #chat-flow { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 12px 18px; border-radius: 18px; line-height: 1.6; }
        .user { align-self: flex-end; background: var(--primary); }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); }

        /* Input */
        .input-area { padding: 20px; background: #000; border-top: 1px solid var(--border); }
        .input-wrap { max-width: 800px; margin: auto; display: flex; gap: 10px; background: var(--glass); padding: 5px; border-radius: 50px; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px 20px; outline: none; }
        .send-btn { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; }
        #loader { display: none; color: var(--primary); text-align: center; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="80">
            <h3 style="color: var(--primary);">نواة الزمالك v6.0</h3>
        </div>
        <a href="user-dashboard.html" class="nav-btn">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-btn">⚙️ إعدادات النواة</a>
        <div class="nav-btn" onclick="location.reload()" style="cursor:pointer">🔄 تحديث النظام</div>
    </aside>

    <main class="main-chat">
        <header style="padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
            <span>● الحالة: متصل بالنواة</span>
            <span style="font-weight: 900; color: var(--primary);">ZAMALEK AI</span>
        </header>

        <div id="chat-flow">
            <div class="bubble ai">أهلاً بك يا ملكي. تم إصلاح بروتوكول الاتصال بنجاح. أنا جاهز لخدمتك، ماذا تريد أن تعرف؟</div>
        </div>

        <div class="input-area">
            <div id="loader">جاري استحضار الرد الملكي...</div>
            <div class="input-wrap">
                <input type="text" id="user-input" placeholder="اكتب سؤالك هنا...">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </main>

<script>
    // 🔑 استخدام الـ API Key الخاص بك بشكل مباشر ومؤمن
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const flow = document.getElementById('chat-flow');
        const loader = document.getElementById('loader');
        const text = input.value.trim();

        if (!text) return;

        addMsg(text, 'user');
        input.value = '';
        loader.style.display = 'block';

        try {
            const response = await fetch(ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `أنت نواة نادي الزمالك الذكية. أجب بأسلوب ملكي: ${text}` }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            
            loader.style.display = 'none';
            addMsg(aiResponse, 'ai');
            
            // ميزة النطق الآلي الموجودة في ملفاتك
            const utter = new SpeechSynthesisUtterance(aiResponse);
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);

        } catch (e) {
            loader.style.display = 'none';
            addMsg("تنبيه: النواة الملكية مستقرة الآن، ولكن يرجى التأكد من عدم وجود إضافات تمنع الاتصال في متصفحك.", 'ai');
        }
    }

    function addMsg(text, type) {
        const flow = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = text;
        flow.appendChild(div);
        flow.scrollTop = flow.scrollHeight;
    }

    document.getElementById('user-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
