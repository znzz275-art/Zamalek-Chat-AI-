<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek Chat AI Vision</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* الحفاظ على تصميمك الملكي الأصلي V6.0 */
        :root {
            --bg-color: #0d0d0d;
            --primary-red: #e41e26;
            --text-color: #f5f5f5;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية */
        .sidebar { width: 280px; background: #000; border-left: 1px solid var(--glass-border); padding: 25px; display: flex; flex-direction: column; }
        .nav-link { padding: 15px; background: var(--glass-bg); color: white; text-decoration: none; border-radius: 12px; margin-bottom: 12px; text-align: center; border: 1px solid var(--glass-border); transition: 0.3s; font-weight: bold; }
        .nav-link:hover { background: var(--primary-red); transform: translateX(-5px); }

        /* منطقة الشات */
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chatWindow { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #111 0%, #0d0d0d 100%); }
        .message { max-width: 80%; padding: 15px 20px; border-radius: 20px; line-height: 1.7; font-size: 15px; animation: fadeIn 0.3s ease; }
        .user-message { align-self: flex-end; background: var(--primary-red); color: white; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 2px; }

        /* صندوق الإدخال المطور */
        .input-area { padding: 25px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--glass-border); display: flex; gap: 12px; }
        #userInput { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; padding: 15px; border-radius: 12px; outline: none; font-family: 'Cairo'; }
        #sendBtn { background: var(--primary-red); border: none; padding: 0 35px; border-radius: 12px; color: white; cursor: pointer; font-weight: 900; transition: 0.3s; }
        #sendBtn:hover { transform: scale(1.05); filter: brightness(1.2); }
        
        #typing { display: none; color: var(--primary-red); padding: 5px 30px; font-size: 13px; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90">
            <h2 style="color: var(--primary-red); margin-top: 15px;">نواة الزمالك AI</h2>
        </div>
        <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
        <div class="nav-link" style="cursor:pointer" onclick="location.reload()">🔄 تحديث النظام</div>
    </div>

    <div class="chat-container">
        <header style="padding: 20px; border-bottom: 1px solid var(--glass-border); text-align: center; font-weight: 900; color: var(--primary-red);">ZAMALEK CORE VISION V6.0</header>
        <div id="chatWindow">
            <div class="message ai-message">أهلاً بك يا ملكي في النسخة السادسة المطورة. تم ربط المحرك بنجاح وتفعيل الأوامر الصوتية. كيف يمكنني خدمتك؟</div>
        </div>
        <div id="typing">النواة الملكية تفكر الآن...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك للمحرك الملكي..." autocomplete="off">
            <button id="sendBtn">إرسال</button>
        </div>
    </div>

<script>
    // استخدام الـ IDs الأصلية من ملفك لضمان عمل الزرار والـ Enter
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typing');

    async function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. عرض رسالة المستخدم
        appendMsg(text, 'user-message');
        userInput.value = '';
        typingIndicator.style.display = 'block';

        try {
            // 2. طلب البيانات من السيرفر (التنسيق المتوافق مع 2026)
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "أنت الآن ذكاء الزمالك. أجب بفخر ملكي: " + text }] }]
                })
            });

            if (!response.ok) throw new Error("Connection Failed");

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            // 3. عرض رد الذكاء الاصطناعي ونطقه
            typingIndicator.style.display = 'none';
            appendMsg(aiText, 'ai-message');
            speak(aiText);

        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMsg("تنبيه من النواة: حدث اضطراب في الاتصال الخارجي. يرجى المحاولة مرة أخرى أو التأكد من مفتاح الـ API.", 'ai-message');
        }
    }

    function appendMsg(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);
        }
    }

    // تفعيل ضغطة الزر
    sendBtn.onclick = handleChat;

    // تفعيل زر Enter (مهم جداً للإرسال)
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleChat();
        }
    });
</script>
</body>
</html>
