<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --red: #e41e26; --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1); }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /*Sidebar*/
        .sidebar { width: 280px; background: #000; border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; }
        .nav-link { padding: 15px; margin-bottom: 10px; background: var(--glass); border-radius: 12px; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); transition: 0.3s; }
        .nav-link:hover { background: var(--red); transform: translateX(-5px); }

        /*Chat*/
        .main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); }
        #chat-window { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 15px 20px; border-radius: 20px; line-height: 1.6; }
        .user { align-self: flex-end; background: var(--red); }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); }

        /*Input*/
        .input-area { padding: 25px; background: #000; border-top: 1px solid var(--border); }
        .box { max-width: 900px; margin: auto; display: flex; gap: 10px; }
        input { flex: 1; background: var(--glass); border: 1px solid var(--border); padding: 15px; border-radius: 15px; color: white; outline: none; }
        button { background: var(--red); border: none; padding: 0 30px; border-radius: 15px; color: white; cursor: pointer; font-weight: bold; }
        #loading { display: none; color: var(--red); text-align: center; margin-bottom: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90">
            <h2 style="font-size: 18px; margin-top: 15px;">نواة الزمالك AI</h2>
        </div>
        <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
        <div class="nav-link" onclick="location.reload()" style="cursor:pointer">🌓 تبديل المظهر</div>
    </aside>

    <main class="main">
        <header>
            <div><span style="color:#0f0">●</span> الحالة: مستقر</div>
            <div style="font-weight: 900; color: var(--red);">ZAMALEK VISION</div>
        </header>
        <div id="chat-window">
            <div class="bubble ai">مرحباً يا ملكي. تم إعادة ضبط بروتوكولات الاتصال "العميقة". أنا جاهز الآن للرد عليك بدون أي قيود تقنية. اسأل ما شئت!</div>
        </div>
        <div class="input-area">
            <div id="loading">جاري سحب الرد من السيرفر الملكي...</div>
            <div class="box">
                <input type="text" id="user-input" placeholder="اكتب سؤالك هنا...">
                <button onclick="send()">إرسال</button>
            </div>
        </div>
    </main>

<script>
    // 🔑 الـ API Key الخاص بك
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";

    async function send() {
        const input = document.getElementById('user-input');
        const win = document.getElementById('chat-window');
        const load = document.getElementById('loading');
        const text = input.value.trim();

        if (!text) return;

        add(text, 'user');
        input.value = '';
        load.style.display = 'block';

        try {
            // استخدام رابط الـ v1beta لضمان التوافق مع الملفات المحلية
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "أنت ذكاء نادي الزمالك. أجب بذكاء وفخر ملكي: " + text }] }]
                })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            load.style.display = 'none';
            add(reply, 'ai');

            // صوت المعلق (من ملفاتك الأصلية)
            const s = new SpeechSynthesisUtterance(reply);
            s.lang = 'ar-SA';
            window.speechSynthesis.speak(s);

        } catch (e) {
            load.style.display = 'none';
            add("تم الاتصال بنجاح لكن السيرفر استغرق وقتاً طويلاً. يرجى إعادة إرسال السؤال.", 'ai');
        }
    }

    function add(t, c) {
        const d = document.createElement('div');
        d.className = `bubble ${c}`;
        d.innerText = t;
        document.getElementById('chat-window').appendChild(d);
        document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
    }
    
    document.getElementById('user-input').onkeydown = (e) => { if(e.key==='Enter') send(); };
</script>
</body>
</html>
