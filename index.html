<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek Chat AI Vision</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <style>
        /* سأحافظ على نفس تصميمك الملكي بدون تغيير */
        :root {
            --bg-color: #0d0d0d;
            --primary-red: #e41e26;
            --text-color: #f5f5f5;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #000; border-left: 1px solid var(--glass-border); padding: 20px; display: flex; flex-direction: column; }
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chatWindow { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 15px; font-size: 15px; line-height: 1.6; }
        .user-message { align-self: flex-end; background: var(--primary-red); color: white; }
        .ai-message { align-self: flex-start; background: var(--glass-bg); border: 1px solid var(--glass-border); }
        .input-area { padding: 20px; background: rgba(0,0,0,0.8); display: flex; gap: 10px; border-top: 1px solid var(--glass-border); }
        input { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 10px; outline: none; }
        button { background: var(--primary-red); border: none; padding: 0 25px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }
        .nav-link { padding: 12px; background: var(--glass-bg); color: white; text-decoration: none; border-radius: 8px; margin-bottom: 10px; text-align: center; display: block; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="80">
            <h3 style="color: var(--primary-red);">نواة الزمالك v6.0</h3>
        </div>
        <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
    </div>

    <div class="chat-container">
        <div id="chatWindow">
            <div class="message ai-message">مرحباً يا ملكي. تم إصلاح بروتوكول الإرسال وربط الأزرار. أنا جاهز الآن للرد عليك فوراً.</div>
        </div>
        <div id="typingIndicator" style="display:none; color:var(--primary-red); padding: 10px;">جاري التفكير في النواة...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="اسأل ذكاء الزمالك..." autocomplete="off">
            <button id="sendBtn">إرسال</button>
        </div>
    </div>

<script>
    // استخدمنا الـ IDs الأصلية من ملفك لضمان عمل الأزرار
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    async function handleMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // إضافة رسالة المستخدم للواجهة
        appendMessage(message, 'user-message');
        userInput.value = '';
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "أنت ذكاء نادي الزمالك المصري. أجب بلهجة ملكية: " + message }] }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            typingIndicator.style.display = 'none';
            appendMessage(aiText, 'ai-message');
            
            // صوت المعلق (كما في كودك الأصلي)
            const speech = new SpeechSynthesisUtterance(aiText);
            speech.lang = 'ar-SA';
            window.speechSynthesis.speak(speech);

        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMessage("يا ملكي، فيه مشكلة في الاتصال. جرب مرة تانية.", 'ai-message');
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // ربط الزرار بالوظيفة
    sendBtn.onclick = handleMessage;

    // تفعيل زر Enter
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleMessage();
    });
</script>
</body>
</html>
