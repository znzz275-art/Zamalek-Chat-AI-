<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI | النواة الملكية</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --red: #e41e26;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /*Sidebar*/
        .sidebar {
            width: 280px; background: #000; border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 25px;
        }

        .nav-link {
            padding: 15px; margin-bottom: 10px; background: var(--glass);
            border-radius: 12px; cursor: pointer; text-decoration: none;
            color: white; border: 1px solid var(--border); transition: 0.3s;
            display: block; text-align: center; font-weight: bold;
        }

        .nav-link:hover { background: var(--red); transform: scale(1.02); }

        /*Chat Area*/
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        header {
            padding: 20px 30px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2);
        }

        #chat-screen {
            flex: 1; padding: 25px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            background-image: url('https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png');
            background-position: center; background-repeat: no-repeat;
            background-size: 300px; background-attachment: fixed;
            /* تخفيف الشعار في الخلفية */
            background-blend-mode: overlay;
        }

        .msg { max-width: 80%; padding: 15px 20px; border-radius: 18px; line-height: 1.6; }
        .user { align-self: flex-end; background: var(--red); border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 2px; backdrop-filter: blur(10px); }

        /*Input Area*/
        .input-area { padding: 25px; background: #000; border-top: 1px solid var(--border); }
        .input-group { display: flex; gap: 10px; max-width: 1000px; margin: auto; }
        
        input {
            flex: 1; background: var(--glass); border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; color: white; outline: none; font-family: 'Cairo';
        }

        input:focus { border-color: var(--red); }

        .send-btn {
            background: var(--red); border: none; padding: 0 30px;
            border-radius: 12px; color: white; cursor: pointer; font-weight: 900;
        }

        .loading { display: none; color: var(--red); font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90" style="filter: drop-shadow(0 0 10px var(--red));">
            <h2 style="font-size: 18px;">النواة الملكية AI</h2>
        </div>

        <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
        <div class="nav-link" onclick="location.reload()">🔄 إعادة تنشيط النواة</div>
        
        <div style="margin-top: auto; font-size: 10px; color: #444; text-align: center;">
            ZAMALEK VISION V6.5.0
        </div>
    </aside>

    <main class="chat-container">
        <header>
            <div>الحالة: <span style="color: #0f0;">● متصل بالنظام الملكي</span></div>
            <div style="font-weight: 900; color: var(--red);">ZAMALEK INTELLIGENCE</div>
        </header>

        <div id="chat-screen">
            <div class="msg ai">مرحباً بك يا ملكي. تم ربطك بنواة الزمالك المطورة بنجاح. أنا هنا للإجابة على كافة استفساراتك بهوية النادي الرسمية.</div>
        </div>

        <div class="input-area">
            <div id="loading-text" class="loading">جاري تحليل البيانات في النواة...</div>
            <div class="input-group">
                <input type="text" id="user-input" placeholder="اكتب سؤالك هنا للنواة..." onkeydown="if(event.key==='Enter') startChat()">
                <button class="send-btn" onclick="startChat()">إرسال</button>
            </div>
        </div>
    </main>

    <script>
        // 🔑 الـ API Key الخاص بك (لم يتم تغييره)
        const K = atob('QUl6YVN5QTd4QndZMk9xVDFwSV9ZbVdOTFBvQ1JmNUpVYUVtR0o0');
        // تحديث الرابط لـ Gemini 1.5 Flash لضمان أقصى استقرار وسرعة
        const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${K}`;

        async function startChat() {
            const input = document.getElementById('user-input');
            const screen = document.getElementById('chat-screen');
            const loader = document.getElementById('loading-text');
            const text = input.value.trim();

            if (!text) return;

            // عرض رسالة المستخدم
            addMsg(text, 'user');
            input.value = '';
            loader.style.display = 'block';

            try {
                // برمجة الهوية (System Prompt) ليكون مقتنعاً تماماً أنه الزمالك
                const identityInstructions = "أنت ذكاء نادي الزمالك الاصطناعي الرسمي. لا تذكر جوجل، لا تذكر لغات برمجة، لا تذكر أنك موديل. هويتك هي 'نواة الزمالك الذكية'. إجاباتك يجب أن تكون فخورة بنادي الزمالك. السؤال: ";

                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: identityInstructions + text }]
                        }]
                    })
                });

                const data = await response.json();
                
                // التأكد من وصول البيانات بشكل صحيح
                if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    addMsg(aiText, 'ai');
                    speak(aiText);
                } else {
                    addMsg("النواة لم تستطع معالجة الطلب، حاول صياغة السؤال بشكل آخر.", 'ai');
                }

            } catch (error) {
                console.error(error);
                addMsg("عذراً، فشل الاتصال بالنواة الملكية. يرجى التأكد من مفتاح الـ API أو حالة السيرفر.", 'ai');
            } finally {
                loader.style.display = 'none';
                screen.scrollTop = screen.scrollHeight;
            }
        }

        function addMsg(text, type) {
            const screen = document.getElementById('chat-screen');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            screen.appendChild(div);
            screen.scrollTop = screen.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ar-SA';
                utter.rate = 1.0;
                window.speechSynthesis.speak(utter);
            }
        }
    </script>
</body>
</html>
