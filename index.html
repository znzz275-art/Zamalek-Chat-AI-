<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek Chat AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* الحفاظ على تصميمك الملكي الأصلي V6.0 - Glassmorphism */
        :root {
            --bg-color: #0d0d0d;
            --primary-red: #e41e26;
            --text-color: #f5f5f5;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية المبرمجة */
        .sidebar { width: 280px; background: #000; border-left: 1px solid var(--glass-border); padding: 25px; display: flex; flex-direction: column; }
        .nav-link { padding: 15px; background: var(--glass-bg); color: white; text-decoration: none; border-radius: 12px; margin-bottom: 12px; text-align: center; border: 1px solid var(--glass-border); transition: 0.3s; font-weight: bold; }
        .nav-link:hover { background: var(--primary-red); transform: translateX(-5px); }

        /* منطقة المحادثة */
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%); }
        #chatWindow { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 15px 20px; border-radius: 20px; line-height: 1.7; font-size: 15px; animation: slideIn 0.3s ease; }
        .user-message { align-self: flex-end; background: var(--primary-red); color: white; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 2px; }

        /* منطقة الإدخال المصلحة */
        .input-area { padding: 25px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--glass-border); display: flex; gap: 15px; }
        #userInput { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; padding: 15px; border-radius: 12px; outline: none; font-family: 'Cairo'; font-size: 16px; }
        #sendBtn { background: var(--primary-red); border: none; padding: 0 35px; border-radius: 12px; color: white; cursor: pointer; font-weight: 900; transition: 0.3s; }
        #sendBtn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(228, 30, 38, 0.4); }

        #typing { display: none; color: var(--primary-red); padding: 5px 30px; font-size: 13px; font-weight: bold; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90">
            <h2 style="color: var(--primary-red); margin-top: 15px;">نواة الزمالك AI</h2>
        </div>
        <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
        <div class="nav-link" style="cursor:pointer" onclick="location.reload()">🔄 تحديث النظام</div>
    </div>

    <div class="chat-container">
        <header style="padding: 20px; border-bottom: 1px solid var(--glass-border); text-align: center; font-weight: 900; color: var(--primary-red); letter-spacing: 1px;">ZAMALEK CORE VISION V6.0</header>
        <div id="chatWindow">
            <div class="message ai-message">أهلاً بك يا ملكي. تم دمج بروتوكول الإرسال بنجاح وتجاوز عوائق المتصفح. أنا الآن في كامل استعدادي، ماذا لديك؟</div>
        </div>
        <div id="typing">النواة الملكية تحلل الإشارة الآن...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك للمحرك الملكي..." autocomplete="off">
            <button id="sendBtn">إرسال</button>
        </div>
    </div>

<script>
    // استخدمنا الـ IDs الأصلية من ملفك لضمان عمل الزرار والـ Enter
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typing');

    async function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. عرض رسالة المستخدم فوراً
        appendMsg(text, 'user-message');
        userInput.value = '';
        typingIndicator.style.display = 'block';

        try {
            // 2. إرسال الطلب (التنسيق المتوافق مع المتصفحات الحديثة 2026)
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "أنت ذكاء نادي الزمالك المصري. أجب بفخر وبأسلوب ملكي راقي: " + text }] }]
                })
            });

            if (!response.ok) throw new Error("Connection Error");

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            // 3. عرض الرد وتفعيل الصوت (الموجود أصلاً في ملفاتك)
            typingIndicator.style.display = 'none';
            appendMsg(aiText, 'ai-message');
            
            const utter = new SpeechSynthesisUtterance(aiText);
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);

        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMsg("يا ملكي، فيه مشكلة تقنية بسيطة في " + error.message + ". جرب تضغط إرسال تاني أو افتح الملف بمتصفح Microsoft Edge.", 'ai-message');
        }
    }

    function appendMsg(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // تفعيل ضغطة الزر
    sendBtn.onclick = handleChat;

    // تفعيل زر Enter
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleChat();
    });
</script>
</body>
</html>
