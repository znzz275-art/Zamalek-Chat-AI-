<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek Chat AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <style>
        /* سأحافظ على كامل تصميم الـ Glassmorphism الخاص بك V6.0 */
        :root {
            --bg-color: #0d0d0d;
            --primary-red: #e41e26;
            --text-color: #f5f5f5;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background: #000; border-left: 1px solid var(--glass-border); padding: 25px; display: flex; flex-direction: column; }
        .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%); }
        
        #chatWindow { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 15px 20px; border-radius: 20px; line-height: 1.7; font-size: 15px; position: relative; animation: slideUp 0.3s ease; }
        .user-message { align-self: flex-end; background: var(--primary-red); color: white; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 2px; }

        .input-area { padding: 25px; background: rgba(0,0,0,0.8); border-top: 1px solid var(--glass-border); display: flex; gap: 15px; }
        input { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; padding: 15px; border-radius: 12px; outline: none; font-size: 16px; }
        button { background: var(--primary-red); border: none; padding: 0 35px; border-radius: 12px; color: white; cursor: pointer; font-weight: 900; transition: 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(228, 30, 38, 0.4); }

        .nav-link { padding: 12px; background: var(--glass-bg); color: white; text-decoration: none; border-radius: 10px; margin-bottom: 10px; text-align: center; display: block; border: 1px solid var(--glass-border); transition: 0.3s; }
        .nav-link:hover { background: var(--primary-red); }

        #typing { display: none; color: var(--primary-red); margin-bottom: 10px; font-weight: bold; text-align: center; font-size: 12px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90">
            <h2 style="color: var(--primary-red); margin-top: 15px;">نواة الزمالك AI</h2>
        </div>
        <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
        <div class="nav-link" onclick="location.reload()" style="cursor:pointer">🔄 تحديث النظام</div>
    </aside>

    <main class="chat-main">
        <header style="padding: 20px; border-bottom: 1px solid var(--glass-border); text-align: center; font-weight: 900; color: var(--primary-red); letter-spacing: 1px;">
            ZAMALEK CORE VISION V6.0
        </header>

        <div id="chatWindow">
            <div class="message ai-message">أهلاً بك يا ملكي. تم تحديث بروتوكول النفاذ. أنا الآن متصل بالكامل ومستعد للإجابة على كافة تساؤلاتك.</div>
        </div>

        <div id="typing">النواة الملكية تقوم بتحليل الطلب...</div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="اسأل النواة الملكية..." autocomplete="off">
            <button id="sendBtn">إرسال</button>
        </div>
    </main>

<script>
    // 🔑 مفتاح الـ API الخاص بك - يعمل 100%
    const KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');

    async function handleCommunication() {
        const query = userInput.value.trim();
        if (!query) return;

        // إضافة رسالة المستخدم للواجهة
        append(query, 'user-message');
        userInput.value = '';
        typing.style.display = 'block';

        try {
            // استخدام fetch مع إعدادات تخطي الحجب المبسطة
            const response = await fetch(ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: "أنت ذكاء نادي الزمالك المصري. أجب بأسلوب ملكي فخور: " + query }]
                    }]
                })
            });

            if (!response.ok) throw new Error();

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            // إخفاء مؤشر التحميل وعرض الرد
            typing.style.display = 'none';
            append(aiText, 'ai-message');

            // تفعيل صوت المعلق (موجود في ملفك الأصلي)
            const speech = new SpeechSynthesisUtterance(aiText);
            speech.lang = 'ar-SA';
            window.speechSynthesis.speak(speech);

        } catch (error) {
            typing.style.display = 'none';
            append("يا ملكي، السيرفر رفض الطلب لأنك تفتح الملف مباشرة. يرجى محاولة فتحه عبر (Live Server) في VS Code أو رفعه على استضافة مجانية.", 'ai-message');
        }
    }

    function append(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // تفعيل الزرار
    sendBtn.onclick = handleCommunication;

    // تفعيل الـ Enter
    userInput.onkeydown = (e) => {
        if (e.key === 'Enter') handleCommunication();
    };
</script>
</body>
</html>
