<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --primary: #e41e26;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f5f5f5;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar - الشريط الجانبي الذكي */
        .sidebar {
            width: 280px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px 15px;
        }

        .logo-box { text-align: center; margin-bottom: 40px; }
        .logo-box img { width: 90px; filter: drop-shadow(0 0 15px var(--primary)); }

        .nav-btn {
            background: var(--glass); border: 1px solid var(--border); color: #fff;
            padding: 15px; border-radius: 12px; margin-bottom: 12px; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; gap: 12px;
            transition: 0.3s; font-weight: bold;
        }

        .nav-btn:hover { background: var(--primary); transform: translateX(-5px); box-shadow: 0 5px 15px rgba(228, 30, 38, 0.3); }

        /* Main Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        header {
            padding: 20px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3);
        }

        #chat-window {
            flex: 1; padding: 30px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }

        .bubble {
            max-width: 80%; padding: 15px 22px; border-radius: 20px; font-size: 15px;
            line-height: 1.7; animation: pop 0.3s ease-out;
        }

        @keyframes pop { from { transform: scale(0.9); opacity: 0; } }

        .user { align-self: flex-end; background: linear-gradient(135deg, #e41e26, #b31217); color: white; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        /* Input Bar */
        .input-area { padding: 30px; background: rgba(0,0,0,0.5); border-top: 1px solid var(--border); }
        .input-wrapper {
            max-width: 900px; margin: auto; display: flex; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 8px; border-radius: 18px; border: 1px solid var(--border);
        }

        input {
            flex: 1; background: transparent; border: none; color: white;
            padding: 12px; outline: none; font-family: 'Cairo'; font-size: 16px;
        }

        .send-btn {
            background: var(--primary); border: none; padding: 0 25px;
            border-radius: 12px; color: white; cursor: pointer; font-weight: 900;
        }

        /* Typing Indicator */
        .loader { display: none; color: var(--primary); text-align: center; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-box">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" alt="Zamalek">
            <h2 style="font-size: 18px; margin-top: 15px; font-weight: 900;">محرك الزمالك الذكي</h2>
        </div>

        <a href="user-dashboard.html" class="nav-btn"><span>📊</span> لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-btn"><span>⚙️</span> إعدادات النواة</a>
        <div class="nav-btn" onclick="toggleMode()"><span>🌓</span> تبديل المظهر</div>

        <div style="margin-top: auto; text-align: center; font-size: 10px; opacity: 0.5;">
            Core Version: 6.5.9 (Z-Vision)
        </div>
    </aside>

    <main class="main-chat">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="pulse" style="width:10px; height:10px; background:#0f0; border-radius:50%; box-shadow: 0 0 10px #0f0;"></span>
                <span style="font-weight: bold;">الحالة: متصل بالنواة</span>
            </div>
            <div style="color: var(--primary); font-weight: 900;">ZAMALEK AI</div>
        </header>

        <div id="chat-window">
            <div class="bubble ai">أهلاً بك يا ملكي. تم تحديث بروتوكول الاتصال بنجاح. أنا ذكاء نادي الزمالك، جاهز لخدمتك وتحليل طلباتك. ما هي تعليماتك؟</div>
        </div>

        <div class="input-area">
            <div id="loader" class="loader">جاري استحضار البيانات من النواة الملكية...</div>
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="اكتب رسالتك للمحرك..." autocomplete="off">
                <button class="send-btn" onclick="sendToAI()">إرسال</button>
            </div>
        </div>
    </main>

<script>
    // 🔑 الـ API Key الخاص بك (مباشر وبدون تشفير لضمان عدم الفشل)
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    async function sendToAI() {
        const input = document.getElementById('user-input');
        const windowChat = document.getElementById('chat-window');
        const loader = document.getElementById('loader');
        const text = input.value.trim();

        if (!text) return;

        // 1. عرض رسالة المستخدم
        appendMsg(text, 'user');
        input.value = '';
        loader.style.display = 'block';

        try {
            // 2. إعداد الطلب (Payload) المحدث 2026
            const response = await fetch(ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ 
                            text: `أنت مساعد ذكي مخصص لنادي الزمالك. اسمك 'نواة الزمالك'. هويتك زملكاوية ملكية. لا تذكر جوجل إطلاقاً. أجب على هذا السؤال بذكاء: ${text}` 
                        }]
                    }]
                })
            });

            if (!response.ok) throw new Error();

            const data = await response.json();
            const aiResult = data.candidates[0].content.parts[0].text;

            // 3. عرض النتيجة وتفعيل الصوت
            loader.style.display = 'none';
            appendMsg(aiResult, 'ai');
            speak(aiResult);

        } catch (error) {
            loader.style.display = 'none';
            appendMsg("تنبيه: حدث اضطراب مؤقت في النواة. يرجى التحقق من استقرار اتصالك أو المحاولة لاحقاً.", 'ai');
        }
    }

    function appendMsg(text, type) {
        const windowChat = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = text;
        windowChat.appendChild(div);
        windowChat.scrollTop = windowChat.scrollHeight;
    }

    function speak(text) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ar-SA';
        window.speechSynthesis.speak(utter);
    }

    function toggleMode() {
        document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
    }

    // تفعيل مفتاح Enter
    document.getElementById('user-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendToAI();
    });
</script>
</body>
</html>
