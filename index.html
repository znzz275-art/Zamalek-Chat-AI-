<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek Chat AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <style>
        /* الحفاظ على تصميمك الملكي الأصلي V6.0 */
        :root {
            --bg-color: #0d0d0d;
            --primary-red: #e41e26;
            --text-color: #f5f5f5;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #000; border-left: 1px solid var(--glass-border); padding: 25px; display: flex; flex-direction: column; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%); }
        #chatWindow { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 15px; font-size: 15px; line-height: 1.6; animation: fadeIn 0.3s ease; }
        .user-message { align-self: flex-end; background: var(--primary-red); }
        .ai-message { align-self: flex-start; background: var(--glass-bg); border: 1px solid var(--glass-border); }
        .input-area { padding: 20px; background: #000; border-top: 1px solid var(--glass-border); display: flex; gap: 10px; }
        input { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 10px; outline: none; }
        button { background: var(--primary-red); border: none; padding: 0 25px; border-radius: 10px; color: white; cursor: pointer; font-weight: 900; }
        .nav-link { padding: 12px; background: var(--glass-bg); color: white; text-decoration: none; border-radius: 8px; margin-bottom: 10px; text-align: center; display: block; }
        #loading { display: none; color: var(--primary-red); text-align: center; font-size: 12px; margin-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div style="text-align: center; margin-bottom: 30px;">
        <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="80">
        <h3 style="color: var(--primary-red);">Zamalek AI V6.0</h3>
    </div>
    <a href="user-dashboard.html" class="nav-link">📊 لوحة التحكم</a>
    <a href="ai_panel.html" class="nav-link">⚙️ إعدادات النواة</a>
    <div class="nav-link" style="cursor:pointer" onclick="location.reload()">🔄 إعادة تشغيل</div>
</aside>

<main class="chat-main">
    <div id="chatWindow">
        <div class="message ai-message">مرحباً بك يا ملكي. تم إصلاح بروتوكول "النفاذ العابر" وتخطي حظر المتصفح. أنا جاهز الآن للرد على أي استفسار.</div>
    </div>
    <div id="loading">النواة الملكية تستحضر الإجابة...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اسأل النواة..." autocomplete="off">
        <button id="sendBtn">إرسال</button>
    </div>
</main>

<script>
    // 🔑 بيانات الاتصال المحدثة 2026
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const loading = document.getElementById('loading');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // إضافة رسالة المستخدم
        appendMsg(text, 'user-message');
        userInput.value = '';
        loading.style.display = 'block';

        try {
            const response = await fetch(URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "أنت ذكاء نادي الزمالك. أجب بذكاء وفخر ملكي: " + text }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const aiText = data.candidates[0].content.parts[0].text;
                appendMsg(aiText, 'ai-message');
                
                // تفعيل الصوت
                const speech = new SpeechSynthesisUtterance(aiText);
                speech.lang = 'ar-SA';
                window.speechSynthesis.speak(speech);
            } else {
                throw new Error();
            }
        } catch (e) {
            appendMsg("عذراً يا ملكي، يبدو أن هناك تعارض في المتصفح. حاول ضغط Enter مرة أخرى أو افتح الملف في متصفح مختلف.", 'ai-message');
        } finally {
            loading.style.display = 'none';
        }
    }

    function appendMsg(t, c) {
        const d = document.createElement('div');
        d.className = `message ${c}`;
        d.innerText = t;
        chatWindow.appendChild(d);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // ربط الأزرار
    sendBtn.onclick = sendMessage;
    userInput.onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
