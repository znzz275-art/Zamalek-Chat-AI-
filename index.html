<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI | المحرك الملكي</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --red: #e41e26;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: white; margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px; background: #000; border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 25px;
        }

        .nav-btn {
            padding: 15px; margin-bottom: 12px; background: var(--glass);
            border-radius: 12px; color: white; text-decoration: none;
            display: block; text-align: center; font-weight: bold; border: 1px solid var(--border);
            transition: 0.3s;
        }

        .nav-btn:hover { background: var(--red); transform: translateY(-3px); }

        /* Main */
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #080808; }
        
        header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-window {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }

        .bubble { max-width: 80%; padding: 15px 20px; border-radius: 18px; line-height: 1.7; position: relative; }
        .user { align-self: flex-end; background: var(--red); box-shadow: 0 4px 15px rgba(228, 30, 38, 0.2); }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); }

        /* Input */
        .input-area { padding: 30px; background: #000; border-top: 1px solid var(--border); }
        .input-box { display: flex; gap: 10px; max-width: 900px; margin: auto; }
        
        input {
            flex: 1; background: var(--glass); border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; color: white; outline: none; font-family: 'Cairo';
        }

        .send-btn {
            background: var(--red); border: none; padding: 0 30px;
            border-radius: 12px; color: white; cursor: pointer; font-weight: bold;
        }

        .typing { display: none; color: var(--red); font-size: 13px; margin-bottom: 5px; text-align: center; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90">
            <h2 style="font-size: 18px; margin-top: 15px;">ZAMALEK AI</h2>
        </div>

        <a href="user-dashboard.html" class="nav-btn">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-btn">⚙️ إعدادات النواة</a>
        <div class="nav-btn" onclick="toggleTheme()" style="cursor:pointer">🌓 تبديل المظهر</div>
        
        <div style="margin-top: auto; font-size: 11px; color: #444; text-align: center;">V6.5.2 | الذكاء الملكي</div>
    </aside>

    <main class="chat-container">
        <header>
            <div id="connection-status"><span style="color:#0f0">●</span> متصل بالنواة</div>
            <div style="font-weight: 900; letter-spacing: 1px;">نظام الزمالك الذكي</div>
        </header>

        <div id="chat-window">
            <div class="bubble ai">مرحباً بك يا ملكي. أنا ذكاء نادي الزمالك المتطور. كيف يمكنني خدمتك اليوم؟</div>
        </div>

        <div class="input-area">
            <div id="typing-indicator" class="typing">جاري استحضار الرد من النواة...</div>
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اسأل المحرك عن أي شيء..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </main>

<script>
    // 🔑 الـ API Key الخاص بك (تم استخراجه بشكل مباشر لضمان العمل)
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const windowChat = document.getElementById('chat-window');
        const typing = document.getElementById('typing-indicator');
        const text = input.value.trim();

        if (!text) return;

        // 1. إضافة رسالة المستخدم
        addBubble(text, 'user');
        input.value = '';
        typing.style.display = 'block';

        // 2. إعداد طلب الـ API ببرمجة الشخصية الملكية
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `أنت الآن "محرك الزمالك الذكي". هويتك زملكاوية ملكية. لا تذكر أنك موديل لغوي أو تابع لجوجل. رد بلهجة مشجع زملكاوي مثقف وواثق. السؤال: ${text}`
                        }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                addBubble(aiResponse, 'ai');
                speak(aiResponse);
            } else {
                throw new Error("Invalid Response");
            }

        } catch (error) {
            addBubble("عذراً يا ملكي، يبدو أن هناك ضغطاً على النواة. تأكد من اتصالك بالإنترنت وحاول مجدداً.", 'ai');
            console.error(error);
        } finally {
            typing.style.display = 'none';
            windowChat.scrollTop = windowChat.scrollHeight;
        }
    }

    function addBubble(text, type) {
        const windowChat = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = text;
        windowChat.appendChild(div);
        windowChat.scrollTop = windowChat.scrollHeight;
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);
        }
    }

    function toggleTheme() {
        document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
    }
</script>

</body>
</html>
