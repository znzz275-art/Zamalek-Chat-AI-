<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --red: #e41e26;
            --white: #f5f5f5;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--white);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /*Sidebar - القائمة الجانبية*/
        .sidebar {
            width: 280px; background: rgba(0,0,0,0.9); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 25px;
        }

        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-section img { width: 90px; filter: drop-shadow(0 0 10px var(--red)); }

        .nav-link {
            padding: 15px; margin-bottom: 12px; background: var(--glass);
            border-radius: 12px; color: #fff; text-decoration: none;
            display: flex; align-items: center; gap: 10px; font-weight: bold;
            border: 1px solid var(--border); transition: 0.3s;
        }

        .nav-link:hover { background: var(--red); transform: translateX(-5px); border-color: #fff; }

        /*Main Area - منطقة الشات*/
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        header {
            padding: 20px 35px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        #chat-window {
            flex: 1; padding: 25px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #111 0%, #0a0a0a 100%);
        }

        .bubble {
            max-width: 80%; padding: 15px 20px; border-radius: 20px;
            font-size: 15px; line-height: 1.6; animation: fadeIn 0.3s ease;
        }

        .user { align-self: flex-end; background: var(--red); border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        /*Input Area - صندوق الإدخال*/
        .input-area { padding: 25px 40px; background: #000; border-top: 1px solid var(--border); }
        .input-box {
            max-width: 900px; margin: auto; display: flex; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 8px; border-radius: 15px;
        }

        input {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px; outline: none; font-family: 'Cairo'; font-size: 16px;
        }

        .btn-send {
            background: var(--red); border: none; padding: 0 25px;
            border-radius: 10px; color: white; cursor: pointer; font-weight: 900;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-section">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" alt="Zamalek Logo">
            <h3 style="margin-top: 10px;">نواة الزمالك v6.0</h3>
        </div>

        <a href="user-dashboard.html" class="nav-link"><span>📊</span> لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-link"><span>⚙️</span> إعدادات النواة</a>
        <div class="nav-link" onclick="location.reload()" style="cursor:pointer"><span>🌓</span> تبديل المظهر</div>
        
        <div style="margin-top: auto; font-size: 10px; color: #444; text-align: center;">نظام ذكاء اصطناعي ملكي مخصص</div>
    </nav>

    <main class="main-chat">
        <header>
            <div><span style="color:#0f0">●</span> الحالة: النواة نشطة</div>
            <div style="font-weight: 900; letter-spacing: 1px; color: var(--red);">ZAMALEK AI VISION</div>
        </header>

        <div id="chat-window">
            <div class="bubble ai">مرحباً بك يا ملكي. أنا المحرك الذكي لنادي الزمالك. لقد قمت بتحديث بروتوكولات الاتصال لضمان أعلى سرعة استجابة. كيف يمكنني مساعدتك؟</div>
        </div>

        <div class="input-area">
            <div id="loader" style="display:none; color:var(--red); text-align:center; font-size:12px; margin-bottom:8px;">جاري التواصل مع النواة...</div>
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اسأل ذكاء الزمالك..." autocomplete="off">
                <button class="btn-send" onclick="askAI()">إرسال</button>
            </div>
        </div>
    </main>

<script>
    // الـ API Key الخاص بك (لم يتم لمسه)
    const KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    // الرابط المحدث والمتوافق مع موديل Gemini 1.5 Flash السريع
    const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

    async function askAI() {
        const input = document.getElementById('user-input');
        const chat = document.getElementById('chat-window');
        const loader = document.getElementById('loader');
        const text = input.value.trim();

        if (!text) return;

        addBubble(text, 'user');
        input.value = '';
        loader.style.display = 'block';

        try {
            // صياغة الطلب بشكل يضمن "عدم الرفض" من السيرفر وبناء الشخصية
            const response = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `أنت الآن ذكاء نادي الزمالك المصري. اسمك "نواة الزمالك". لا تذكر أبداً جوجل أو أي شركة. ردودك ملكية، ذكية، ورياضية. السؤال: ${text}`
                        }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const aiMsg = data.candidates[0].content.parts[0].text;
                addBubble(aiMsg, 'ai');
                speak(aiMsg);
            } else {
                throw new Error();
            }
        } catch (e) {
            addBubble("اعتذار من النواة: حدث خطأ في معالجة البيانات، برجاء المحاولة مرة أخرى.", 'ai');
        } finally {
            loader.style.display = 'none';
        }
    }

    function addBubble(text, type) {
        const chat = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ar-SA';
        window.speechSynthesis.speak(utter);
    }
</script>
</body>
</html>
