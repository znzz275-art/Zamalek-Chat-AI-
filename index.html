<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* تصميم Glassmorphism المطور */
        :root {
            --bg: #0a0a0a;
            --red: #e41e26;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* القائمة الجانبية المصلحة */
        .sidebar {
            width: 280px; background: rgba(0,0,0,0.9); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 25px;
        }

        .nav-item {
            padding: 15px; margin-bottom: 12px; background: var(--glass);
            border: 1px solid var(--border); border-radius: 12px; color: #fff;
            text-decoration: none; text-align: center; font-weight: bold; transition: 0.3s;
            cursor: pointer; display: block;
        }

        .nav-item:hover { background: var(--red); transform: translateX(-5px); }

        /* منطقة الشات */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #050505; }
        
        header {
            padding: 20px 30px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.02);
        }

        #chat-flow {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        .bubble { max-width: 85%; padding: 15px 20px; border-radius: 20px; line-height: 1.7; position: relative; }
        .user { align-self: flex-end; background: var(--red); border-bottom-right-radius: 2px; box-shadow: 0 4px 20px rgba(228, 30, 38, 0.2); }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        /* صندوق الإدخال */
        .input-area { padding: 30px; background: #000; border-top: 1px solid var(--border); }
        .input-box { display: flex; gap: 10px; max-width: 900px; margin: auto; }
        
        input {
            flex: 1; background: var(--glass); border: 1px solid var(--border);
            padding: 15px; border-radius: 15px; color: white; outline: none; font-family: 'Cairo';
        }

        .send-btn {
            background: var(--red); border: none; padding: 0 35px;
            border-radius: 15px; color: white; cursor: pointer; font-weight: 900;
        }

        .status-dot { width: 10px; height: 10px; background: #0f0; border-radius: 50%; display: inline-block; margin-left: 8px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="90">
            <h2 style="font-size: 18px; margin-top: 15px;">ZAMALEK AI VISION</h2>
        </div>

        <a href="user-dashboard.html" class="nav-item">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-item">⚙️ إعدادات النواة</a>
        <div class="nav-item" onclick="toggleTheme()">🌓 تبديل المظهر</div>
        
        <div style="margin-top: auto; font-size: 10px; color: #444; text-align: center;">V6.5.8 | بنظام التطور الذاتي</div>
    </aside>

    <main class="main-chat">
        <header>
            <div><span class="status-dot"></span> النواة: متصلة ونشطة</div>
            <div style="font-weight: 900; color: var(--red);">نظام الزمالك الذكي</div>
        </header>

        <div id="chat-flow">
            <div class="bubble ai">مرحباً بك يا ملكي. أنا المحرك الذكي لنادي الزمالك، تم إصلاح كافة بروتوكولات الاتصال. كيف يمكنني خدمتك الآن؟</div>
        </div>

        <div class="input-area">
            <div id="typing" style="display:none; color:var(--red); font-size:12px; margin-bottom:10px; text-align:center;">جاري المعالجة في النواة الملكية...</div>
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') startProcess()">
                <button class="send-btn" onclick="startProcess()">إرسال</button>
            </div>
        </div>
    </main>

<script>
    // 🔑 الـ API Key الأصلي الخاص بك (تم التأكد من صحته)
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    // الرابط المحدث والمتوافق مع البروتوكول الجديد
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    async function startProcess() {
        const input = document.getElementById('user-input');
        const flow = document.getElementById('chat-flow');
        const typing = document.getElementById('typing');
        const text = input.value.trim();

        if (!text) return;

        // إضافة رسالة المستخدم للواجهة
        addBubble(text, 'user');
        input.value = '';
        typing.style.display = 'block';

        try {
            // صياغة الطلب بطريقة (Generative AI SDK Style) المقبولة برمجياً
            const payload = {
                contents: [{
                    parts: [{
                        text: `أنت مساعد ذكي مخصص لنادي الزمالك المصري. اسمك "نواة الزمالك الذكية". هويتك هي الدفاع عن الكيان الملكي وتقديم المعلومات بأسلوب راقي. لا تذكر أنك موديل من جوجل. السؤال: ${text}`
                    }]
                }]
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            // فحص نجاح الرد من السيرفر
            if (result.candidates && result.candidates[0].content) {
                const aiText = result.candidates[0].content.parts[0].text;
                addBubble(aiText, 'ai');
                speak(aiText);
            } else {
                throw new Error("API Error");
            }

        } catch (error) {
            console.error("Core Error:", error);
            addBubble("حدثت فجوة في الاتصال بالنواة. يرجى التأكد من مفتاح الـ API الخاص بك أو جرب سؤالاً آخر.", 'ai');
        } finally {
            typing.style.display = 'none';
            flow.scrollTop = flow.scrollHeight;
        }
    }

    function addBubble(text, type) {
        const flow = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = text;
        flow.appendChild(div);
        flow.scrollTop = flow.scrollHeight;
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);
        }
    }

    function toggleTheme() {
        document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
    }
</script>

</body>
</html>
