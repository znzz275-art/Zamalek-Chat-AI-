<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI | النواة الملكية</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --red: #e41e26;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: white; margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px; background: rgba(0,0,0,0.95); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 25px; z-index: 1000;
        }

        .nav-btn {
            padding: 15px; margin-bottom: 12px; background: var(--glass);
            border-radius: 12px; color: white; text-decoration: none;
            display: flex; align-items: center; gap: 10px; font-weight: bold;
            border: 1px solid var(--border); transition: 0.3s;
        }

        .nav-btn:hover { background: var(--red); transform: translateX(-5px); }

        /* Main Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        header {
            padding: 20px 30px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
        }

        #chat-window {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
            background: radial-gradient(circle at center, #111 0%, #080808 100%);
        }

        .msg { max-width: 80%; padding: 15px 20px; border-radius: 20px; line-height: 1.7; position: relative; font-size: 15px; }
        .user { align-self: flex-end; background: var(--red); border-bottom-right-radius: 2px; box-shadow: 0 4px 15px rgba(228, 30, 38, 0.3); }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        /* Input Area */
        .input-area { padding: 25px 40px; background: #000; border-top: 1px solid var(--border); }
        .input-wrapper { display: flex; gap: 12px; max-width: 1000px; margin: auto; }
        
        input {
            flex: 1; background: var(--glass); border: 1px solid var(--border);
            padding: 15px 20px; border-radius: 15px; color: white; outline: none;
            font-family: 'Cairo'; font-size: 16px;
        }

        .send-btn {
            background: var(--red); border: none; padding: 0 35px;
            border-radius: 15px; color: white; cursor: pointer; font-weight: 900;
            transition: 0.3s;
        }
        .send-btn:hover { filter: brightness(1.2); transform: scale(1.05); }

        #typing { display: none; color: var(--red); font-size: 12px; margin-bottom: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 50px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="100">
            <h2 style="font-size: 18px; margin-top: 15px; letter-spacing: 1px;">محرك الزمالك الذكي</h2>
        </div>

        <a href="user-dashboard.html" class="nav-btn">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-btn">⚙️ إعدادات النواة</a>
        <div class="nav-btn" onclick="location.reload()" style="cursor:pointer">🌓 تبديل المظهر</div>
        
        <div style="margin-top: auto; font-size: 11px; color: #444; text-align: center; border-top: 1px solid #222; pt-10px;">
            ZAMALEK CORE v6.5.5 | الملكي
        </div>
    </aside>

    <main class="chat-container">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="color:#0f0; animation: pulse 2s infinite;">●</span> 
                <span id="header-status">النظام: مستعد</span>
            </div>
            <div style="font-weight: 900; color: var(--red);">ZAMALEK VISION</div>
        </header>

        <div id="chat-window">
            <div class="msg ai">أهلاً بك في النسخة المطورة من ذكاء نادي الزمالك. أنا المحرك الرسمي للنادي، مبرمج لخدمة الكيان الملكي وجماهيره. كيف يمكنني مساعدتك؟</div>
        </div>

        <div class="input-area">
            <div id="typing">جاري تحليل البيانات في النواة الملكية...</div>
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="اسأل المحرك الملكي..." autocomplete="off">
                <button class="send-btn" id="send-btn">إرسال</button>
            </div>
        </div>
    </main>

<script>
    // 🔑 استخدام الـ API كـ "String" مباشر لضمان عدم حدوث خطأ في الـ Decoding
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY;

    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typing = document.getElementById('typing');

    async function handleChat() {
        const message = userInput.value.trim();
        if (!message) return;

        // إضافة رسالة المستخدم
        appendMessage(message, 'user');
        userInput.value = '';
        typing.style.display = 'block';

        try {
            // "برمجة الهوية" - التعليمات التي تجعل الموديل يعرف أنه الزمالك فقط
            const promptData = {
                contents: [{
                    parts: [{
                        text: `أنت الآن "محرك الزمالك الذكي". أنت لست موديل لغوي عام. أنت مساعد رقمي مخصص لنادي الزمالك المصري. هويتك هي الأبيض والأحمر. لا تذكر جوجل. رد دائماً بلهجة ملكية واثقة. السؤال: ${message}`
                    }]
                }]
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(promptData)
            });

            if (!response.ok) throw new Error("Network Error");

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            typing.style.display = 'none';
            appendMessage(aiText, 'ai');
            speak(aiText);

        } catch (err) {
            typing.style.display = 'none';
            appendMessage("حدث تأخير في الاستجابة من النواة. يرجى إعادة المحاولة.", 'ai');
        }
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'ar-SA';
        window.speechSynthesis.speak(speech);
    }

    sendBtn.addEventListener('click', handleChat);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });

</script>
</body>
</html>
