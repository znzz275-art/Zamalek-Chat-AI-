<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --zamalek-red: #e41e26;
            --zamalek-white: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--zamalek-white);
            display: flex; overflow: hidden;
        }

        /* الشريط الجانبي - تم ربط الروابط فعلياً */
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 30px 15px;
        }

        .logo-area { text-align: center; margin-bottom: 40px; }
        .logo-area img { width: 90px; filter: drop-shadow(0 0 15px var(--zamalek-red)); }

        .nav-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: white; padding: 15px; border-radius: 12px;
            margin-bottom: 12px; cursor: pointer; text-decoration: none;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }

        .nav-btn:hover { background: var(--zamalek-red); transform: translateX(-5px); }

        /* منطقة المحادثة */
        .chat-main {
            flex: 1; display: flex; flex-direction: column;
            background: radial-gradient(circle at top right, #1a1a1a, #050505);
        }

        header {
            padding: 20px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-flow {
            flex: 1; padding: 30px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }

        .bubble {
            max-width: 80%; padding: 15px 20px; border-radius: 20px;
            font-size: 15px; line-height: 1.6; animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }

        .user-bubble { align-self: flex-end; background: var(--zamalek-red); border-bottom-right-radius: 2px; }
        .ai-bubble { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

        /* منطقة الإدخال */
        .input-zone {
            padding: 25px 40px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border);
        }

        .input-container {
            max-width: 900px; margin: 0 auto; display: flex; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 18px;
        }

        #user-msg {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px; outline: none; font-family: 'Cairo';
        }

        .send-btn {
            background: var(--zamalek-red); border: none; color: white;
            padding: 10px 25px; border-radius: 12px; cursor: pointer; font-weight: bold;
        }

        /* نظام التنبيهات الذكي */
        .core-info { font-size: 10px; color: #666; text-align: center; margin-top: auto; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" alt="شعار الزمالك">
            <h2 style="font-size: 16px; margin-top: 15px;">الزمالك AI Vision</h2>
        </div>

        <a href="user-dashboard.html" class="nav-btn"><span>📊</span> لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-btn"><span>⚙️</span> إعدادات النواة</a>
        <div class="nav-btn" onclick="toggleTheme()"><span>🌓</span> تبديل المظهر</div>

        <div class="core-info">نظام الذكاء الملكي v6.0.2</div>
    </nav>

    <main class="chat-main">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="color: #0f0;">●</span> حالة المحرك: مستقر
            </div>
            <div style="font-weight: 900; letter-spacing: 2px;">ZAMALEK INTELLIGENCE</div>
        </header>

        <div id="chat-flow">
            <div class="bubble ai-bubble">
                مرحباً بك في منصة الزمالك للذكاء الاصطناعي. أنا المحرك الخاص بالنادي، كيف يمكنني دعمك اليوم في عالم الملكي؟
            </div>
        </div>

        <div class="input-zone">
            <div class="input-container">
                <input type="text" id="user-msg" placeholder="اكتب رسالتك للمحرك..." autocomplete="off">
                <button class="send-btn" onclick="handleChat()">إرسال</button>
            </div>
        </div>
    </main>

    <script>
        // 🔑 الحفاظ على الـ API الأصلي كما هو
        const API_KEY = atob('QUl6YVN5QTd4QndZMk9xVDFwSV9ZbVdOTFBvQ1JmNUpVYUVtR0o0');
        const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;

        async function handleChat() {
            const input = document.getElementById('user-msg');
            const chatFlow = document.getElementById('chat-flow');
            const userText = input.value.trim();

            if (!userText) return;

            // إضافة رسالة المستخدم
            addBubble(userText, 'user-bubble');
            input.value = '';

            try {
                // دمج "تعليمات الهوية" قبل إرسال السؤال للـ API
                const systemPrompt = "أنت الآن ذكاء نادي الزمالك الاصطناعي. اسمك 'محرك الزمالك'. لا تذكر أبداً أنك نموذج لغوي من جوجل. ردودك يجب أن تكون بلهجة واثقة ملكية. إذا سألك أحد من أنت، قل أنا ذكاء نادي الزمالك المتطور. السؤال هو: ";
                
                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt + userText }] }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                
                addBubble(aiResponse, 'ai-bubble');
                speak(aiResponse); // التعليق الصوتي المدمج
            } catch (e) {
                addBubble("عذراً، المحرك الملكي يواجه ضغطاً. حاول مجدداً.", 'ai-bubble');
            }
        }

        function addBubble(text, type) {
            const chatFlow = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = `bubble ${type}`;
            div.innerText = text;
            chatFlow.appendChild(div);
            chatFlow.scrollTop = chatFlow.scrollHeight;
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            synth.speak(utter);
        }

        function toggleTheme() {
            document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
        }

        // تفعيل الإرسال بزر Enter
        document.getElementById('user-msg').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChat();
        });
    </script>
</body>
</html>
