<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamalek AI Vision | النواة الملكية</title> 
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e41e26; --bg: #0a0a0a; --glass: rgba(255,255,255,0.05); }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #000; border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 25px; }
        .nav-item { padding: 15px; margin-bottom: 10px; background: var(--glass); border-radius: 12px; color: white; text-decoration: none; display: block; text-align: center; transition: 0.3s; border: 1px solid transparent; }
        .nav-item:hover { background: var(--red); border-color: white; transform: scale(1.02); }

        /* Main */
        .main-chat { flex: 1; display: flex; flex-direction: column; }
        header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px; border-radius: 15px; line-height: 1.6; }
        .user { align-self: flex-end; background: var(--red); }
        .ai { align-self: flex-start; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); }

        /* Input */
        .input-box { padding: 20px; background: #000; display: flex; gap: 10px; }
        input { flex: 1; background: var(--glass); border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 10px; color: white; outline: none; }
        button { background: var(--red); border: none; padding: 0 30px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/0/04/ZamalekSC.png" width="80">
            <h2 style="font-size: 18px;">نظام الزمالك الذكي</h2>
        </div>
        <a href="user-dashboard.html" class="nav-item">📊 لوحة التحكم</a>
        <a href="ai_panel.html" class="nav-item">⚙️ إعدادات النواة</a>
        <div class="nav-item" style="cursor:pointer" onclick="location.reload()">🔄 إعادة إنعاش النواة</div>
    </div>

    <div class="main-chat">
        <header>
            <div id="status">● الحالة: جاهز</div>
            <div style="font-weight: 900; color: var(--red);">ZAMALEK CORE AI</div>
        </header>
        <div id="chat-window">
            <div class="msg ai">مرحباً بك يا ملكي. تم تحديث بروتوكول "النفاذ المباشر". أنا الآن متصل بالسيرفر وبانتظار أوامرك.</div>
        </div>
        <div class="input-box">
            <input type="text" id="user-in" placeholder="اسأل المحرك الملكي...">
            <button onclick="ask()">إرسال</button>
        </div>
    </div>

<script>
    const API_KEY = "AIzaSyA7xBwY2OqT1pI_YmWNLPoCRf5JUaEmGJ4";

    async function ask() {
        const input = document.getElementById('user-in');
        const win = document.getElementById('chat-window');
        const status = document.getElementById('status');
        const text = input.value.trim();

        if (!text) return;

        // إضافة رسالة المستخدم
        append(text, 'user');
        input.value = '';
        status.innerText = "● جاري المعالجة...";
        status.style.color = "var(--red)";

        try {
            // استخدام الموديل الأسرع gemini-1.5-flash
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "أنت ذكاء نادي الزمالك. رد بأسلوب ملكي: " + text }] }]
                })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            append(reply, 'ai');
            
            // نطق الرد بصوت المعلق
            const msg = new SpeechSynthesisUtterance(reply);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);

        } catch (e) {
            append("يا ملكي، فيه مشكلة في وصول البيانات. جرب تفتح الملف ده من خلال (Live Server) أو ارفعه على استضافة عشان المتصفح يسمح بالاتصال.", "ai");
        } finally {
            status.innerText = "● الحالة: جاهز";
            status.style.color = "#0f0";
        }
    }

    function append(t, c) {
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerText = t;
        win.appendChild(d);
        win.scrollTop = win.scrollHeight;
    }

    document.getElementById('user-in').addEventListener('keypress', (e) => { if(e.key === 'Enter') ask(); });
</script>
</body>
</html>
